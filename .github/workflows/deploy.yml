name: Fleet Logistics CI/CD & Enterprise Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  backend-test-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Unit Tests
        run: |
          cd backend
          npm test

      - name: Build Backend Bundle
        run: |
          cd backend
          npm run build

  web-build:
    name: Admin Web Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Install Dependencies
        run: |
          cd admin-web
          npm ci

      - name: Build Next.js Dashboard
        run: |
          cd admin-web
          npm run build

  android-release:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fleet-driver-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
